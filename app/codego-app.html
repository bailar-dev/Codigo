<style>
/* Layout: tətbiq. Desktopda sol menyu + üst status zolağı + məzmun; telefonda alt tab bar. Kvest ekranı üç panelli iş sahəsidir. Tək açıq tema (brend), kod sahəsi tünd. */
:root {
  --bg: #F5F8FF;
  --ink: #102A54;
  --brand: #0E6FD6;
  --capy: #E9A46A;
  --mono: "JetBrains Mono", Consolas, monospace;
  color-scheme: light;
}
html, body, #root { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: "Nunito", "Segoe UI", Roboto, sans-serif; margin: 0; -webkit-font-smoothing: antialiased; }
.gutter-x { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ed-layer { position: absolute; inset: 0; margin: 0; padding: 14px 16px 40px; font: 13.5px/1.75 var(--mono); white-space: pre; tab-size: 4; }
.ed-pre { overflow: hidden; pointer-events: none; color: #D7DEF2; }
.ed-ta { overflow: auto; color: transparent; caret-color: #7FE3B4; background: transparent; resize: none; border: 0; outline: none; }
.ed-ta::selection { background: rgba(43,211,216,.35); color: transparent; }
.ed-gut { font: 13.5px/1.75 var(--mono); padding: 14px 10px 40px 0; overflow: hidden; text-align: right; user-select: none; color: #4A5A85; }
.tk-kw { color: #C792EA; } .tk-bi { color: #82AAFF; } .tk-fn { color: #7FE3B4; } .tk-str { color: #FFCB6B; } .tk-num { color: #F78C6C; } .tk-com { color: #5C6E99; font-style: italic; }
.xpfill { background: linear-gradient(90deg, #2BD3D8, #0E6FD6 60%, #1F3F8A); transition: width .9s cubic-bezier(.2,.8,.2,1); }
.float { animation: float 4s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-8px); } }
.pop-in { animation: popIn .35s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
.rise { animation: rise .25s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.burst span { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; border-radius: 2px; animation: burst .9s ease-out forwards; }
@keyframes burst { to { transform: translate(var(--dx), var(--dy)) rotate(220deg); opacity: 0; } }
.pulse { animation: pulse 2s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(14,111,214,.5); } 70%,100% { box-shadow: 0 0 0 12px rgba(14,111,214,0); } }
.dots span { animation: dots 1.2s infinite; display: inline-block; } .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
@keyframes dots { 0%,60%,100% { opacity: .25; } 30% { opacity: 1; } }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #C9D5EC; border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
.dark-scroll::-webkit-scrollbar-thumb { background: #22325C; }
:focus-visible { outline: 3px solid #0E6FD6; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .float, .pop-in, .rise, .burst span, .pulse, .dots span { animation: none !important; } .xpfill { transition: none; } }
</style>

// ================= PYTHON (Skulpt) =================
function builtinRead(x) {
  if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) throw "Fayl tapılmadı: '" + x + "'";
  return Sk.builtinFiles["files"][x];
}
async function runPython(src) {
  if (typeof Sk === "undefined") return { out: "", err: "Python mühiti yüklənmədi. Səhifəni yeniləyin." };
  let out = "";
  Sk.configure({ output: t => { out += t; }, read: builtinRead, __future__: Sk.python3, execLimit: 4000, yieldLimit: 100, inputfun: () => "" });
  Sk.execStart = Date.now();
  try { await Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, src, true)); return { out, err: null }; }
  catch (e) { let m = e.toString(); if (/TimeLimit|Timeout/i.test(m)) m = "TimeLimitError: kod 4 saniyədən çox işlədi"; return { out, err: m }; }
}
function harness(fn, tests) {
  return "\n\n__tests = [\n" + tests.map(t => "    (" + t.args + ", " + t.expected + "),").join("\n") + "\n]\n" +
    "for __i in range(len(__tests)):\n    __a, __e = __tests[__i]\n    try:\n        __g = " + fn + "(*__a)\n" +
    "        if __g == __e:\n            print('@@T|' + str(__i) + '|OK|' + repr(__g))\n        else:\n            print('@@T|' + str(__i) + '|FAIL|' + repr(__g))\n" +
    "    except Exception as __x:\n        print('@@T|' + str(__i) + '|ERR|' + str(__x))\n";
}
async function runTests(code, q) {
  const r = await runPython(code + harness(q.fn, q.tests));
  const results = q.tests.map(t => ({ status: "ERR", got: "", test: t }));
  const user = [];
  for (const line of r.out.split("\n")) {
    if (line.startsWith("@@T|")) { const [, i, st, ...rest] = line.split("|"); if (results[+i]) { results[+i].status = st; results[+i].got = rest.join("|"); } }
    else if (line.trim()) user.push(line);
  }
  if (r.err) results.forEach(x => { if (!x.got) x.got = "işləmədi"; });
  return { results, passed: results.filter(x => x.status === "OK").length, err: r.err, user };
}
function diagnose(q, res, code) {
  const err = res.err || "";
  const line = (err.match(/line (\d+)/) || [])[1];
  if (/SyntaxError/.test(err)) return { tag: "syntax", text: "Sintaksis xətası" + (line ? " " + line + "-ci sətirdə" : "") + ". if, for və def sətirlərinin sonunda iki nöqtə (:) olmalıdır. Mötərizələrin bağlandığını da yoxla." };
  if (/IndentationError|indent/i.test(err)) return { tag: "indent", text: "Girinti xətası" + (line ? " " + line + "-ci sətirdə" : "") + ". Python-da blokun içi 4 boşluqla içəri yazılır." };
  const nm = err.match(/name '(\w+)' is not defined/);
  if (nm) return { tag: "name", text: "‘" + nm[1] + "’ adı təyin olunmayıb. Yazılışı yoxla və ya dəyişəni istifadə etməzdən əvvəl yarat." };
  if (/TimeLimit/.test(err)) return { tag: "loop", text: "Kod çox uzun işlədi. Sonsuz dövr ola bilər: while şərti nə vaxt yalan olur?" };
  if (/RecursionError|maximum recursion/i.test(err)) return { tag: "base", text: "Rekursiya dayanmır. Baza halını yoxla: hansı n üçün funksiya dərhal cavab qaytarır?" };
  if (/TypeError/.test(err)) return { tag: "type", text: "Tip xətası: məsələn ədədlə sətri birləşdirmək olmur. str() və ya int() ilə çevirməyi yoxla." };
  const fails = res.results.filter(x => x.status !== "OK");
  if (fails.length && fails.every(x => x.got === "None")) return { tag: "return", text: "Funksiya heç nə qaytarmır (None). print yox, return istifadə et." };
  if (q.tag === "range" && fails.length && /range\s*\(/.test(code)) return { tag: "offbyone", text: "Off-by-one: nəticə bir element az və ya çox çıxır. range() son ədədi daxil etmir. n-in özü dövrə düşürmü?" };
  const f = fails[0];
  if (f) return { tag: "logic", text: q.fn + "(" + f.test.args.slice(1, -1) + ") üçün " + f.test.expected + " gözlənilirdi, amma " + (f.got || "xəta") + " alındı. Bu girişlə kodun addım-addım nə etdiyini düşün." };
  return null;
}

// ================= HIGHLIGHT =================
const KW = new Set(["def","for","in","if","elif","else","while","return","import","from","as","and","or","not","True","False","None","class","break","continue","pass","lambda"]);
const BI = new Set(["print","range","len","max","min","sum","list","dict","str","int","float","enumerate","abs","round","sorted","set"]);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function highlight(src) {
  const re = /(#[^\n]*)|([fFrRbB]?"(?:[^"\\\n]|\\.)*"?|[fFrRbB]?'(?:[^'\\\n]|\\.)*'?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index)); const t = m[0];
    if (m[1]) out += '<span class="tk-com">' + esc(t) + "</span>";
    else if (m[2]) out += '<span class="tk-str">' + esc(t) + "</span>";
    else if (m[3]) out += '<span class="tk-num">' + t + "</span>";
    else if (KW.has(t)) out += '<span class="tk-kw">' + t + "</span>";
    else if (BI.has(t)) out += '<span class="tk-bi">' + t + "</span>";
    else if (m[4]) out += '<span class="tk-fn">' + t + "</span>";
    else out += t;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last)) + "\n";
}

function Editor({ code, setCode, onRun }) {
  const ta = useRef(), pre = useRef(), gut = useRef();
  const lines = code.split("\n").length;
  const sync = () => { const t = ta.current; pre.current.scrollTop = t.scrollTop; pre.current.scrollLeft = t.scrollLeft; gut.current.scrollTop = t.scrollTop; };
  const onKeyDown = e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); onRun(); return; }
    if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); const t = e.target, s = t.selectionStart, en = t.selectionEnd; setCode(code.slice(0, s) + "    " + code.slice(en)); requestAnimationFrame(() => { t.selectionStart = t.selectionEnd = s + 4; }); }
    if (e.key === "Enter" && !e.ctrlKey) {
      const t = e.target, s = t.selectionStart; const lineStart = code.lastIndexOf("\n", s - 1) + 1; const line = code.slice(lineStart, s);
      let indent = line.match(/^\s*/)[0]; if (/:\s*$/.test(line)) indent += "    ";
      e.preventDefault(); setCode(code.slice(0, s) + "\n" + indent + code.slice(t.selectionEnd)); requestAnimationFrame(() => { t.selectionStart = t.selectionEnd = s + 1 + indent.length; });
    }
  };
  return html`<div className="flex flex-1 min-h-[260px] bg-code-900">
    <div ref=${gut} className="ed-gut w-11 shrink-0" aria-hidden="true">${Array.from({ length: lines }, (_, i) => html`<div key=${i}>${i + 1}</div>`)}</div>
    <div className="relative flex-1 min-w-0">
      <pre ref=${pre} className="ed-layer ed-pre" aria-hidden="true" dangerouslySetInnerHTML=${{ __html: highlight(code) }}></pre>
      <textarea ref=${ta} className="ed-layer ed-ta dark-scroll" spellCheck="false" autoCapitalize="off" autoComplete="off" aria-label="Python kod redaktoru" value=${code} onChange=${e => setCode(e.target.value)} onScroll=${sync} onKeyDown=${onKeyDown}></textarea>
    </div>
  </div>`;
}

function Workspace({ st, qid, update, back, toast, celebrate }) {
  const q = allQuests(st).find(x => x.id === qid);
  const code = st.codes[qid] ?? q.starter;
  const mode = st.modes[qid] || "hint";
  const [term, setTerm] = useState([{ t: "Codigo Python 3 · kodu yaz və \"Yoxla\" düyməsini bas (Ctrl+Enter)", c: "text-[#7480A6]" }]);
  const [results, setResults] = useState(null);
  const [running, setRunning] = useState(false);
  const [chat, setChat] = useState(() => [{ from: "ai", kind: "intro", text: mode === "hint" ? "Salam! Bu kvestdə yanındayam. Çətinlik çəksən, sual ver və ya \"İpucu\" düyməsini bas. Kodu sənin yerinə yazmayacağam, amma birlikdə tapacağıq." : mode === "exam" ? "Bu kvest imtahan rejimindədir. Müəllim AI köməyini bağlayıb. Uğurlar!" : "Bu kvest üçün müəllim AI köməyini söndürüb. Testlərin nəticəsinə diqqətlə bax." }]);
  const [typing, setTyping] = useState(false);
  const [msg, setMsg] = useState("");
  const [tab, setTab] = useState("task");
  const [burst, setBurst] = useState(0);
  const termRef = useRef(), chatRef = useRef();
  useEffect(() => { termRef.current && (termRef.current.scrollTop = 1e6); }, [term]);
  useEffect(() => { chatRef.current && (chatRef.current.scrollTop = 1e6); }, [chat, typing]);
  const setCode = v => update(s => ({ ...s, codes: { ...s.codes, [qid]: v } }));
  const hints = st.hintsUsed[qid] || 0;
  const done = !!st.completed[qid];
  const aiOn = mode === "hint";
  const say = async (m, delay = 650) => { setTyping(true); await sleep(delay); setTyping(false); setChat(c => [...c, { from: "ai", ...m }]); };

  const runOnly = async () => {
    if (running) return;
    setRunning(true); setTab("term");
    setTerm(t => [...t, { t: "PS C:\\Codigo> python " + q.fn + ".py", c: "text-[#4FC1FF]" }]);
    const r = await runPython(code);
    const lines = r.out.split("\n").filter(Boolean).map(t => ({ t }));
    setTerm(t => [...t, ...(lines.length ? lines : [{ t: "(kod heç nə çap etmədi. Funksiyanı yoxlamaq üçün \"Yoxla\" bas)", c: "text-[#7480A6]" }]), ...(r.err ? [{ t: r.err, c: "text-[#FF8A85]" }] : [])]);
    setRunning(false);
  };

  const check = async () => {
    if (running) return;
    setRunning(true); setTab("term");
    setTerm(t => [...t, { t: "PS C:\\Codigo> codigo test " + q.fn + ".py", c: "text-[#4FC1FF]" }]);
    const r = await runTests(code, q);
    for (const u of r.user) setTerm(t => [...t, { t: u }]);
    for (let i = 0; i < r.results.length; i++) {
      await sleep(160); const x = r.results[i];
      setTerm(t => [...t, { t: (x.status === "OK" ? "  ✔ " : "  ✘ ") + (mode === "exam" ? "Test " + (i + 1) : q.fn + "(" + x.test.args.slice(1, -1) + ") → " + x.got + (x.status === "OK" ? "" : "   gözlənilən: " + x.test.expected)), c: x.status === "OK" ? "text-[#7FE3B4]" : "text-[#FF8A85]" }]);
    }
    if (r.err && !r.results.some(x => x.status === "OK")) setTerm(t => [...t, { t: r.err, c: "text-[#FF8A85]" }]);
    const ok = r.passed === q.tests.length;
    setResults(r); setRunning(false);
    const attempts = (st.attempts[qid] || 0) + 1;
    if (ok) {
      setTerm(t => [...t, { t: "★ " + r.passed + "/" + q.tests.length + " test keçdi" + (done ? "" : " · +" + q.xp + " XP"), c: "text-[#FFCB6B] font-bold" }]);
      if (!done) { setBurst(Date.now()); celebrate(q, { attempts, hints }); }
      if (aiOn) say({ kind: "success", text: done ? "Yenə əla! Bu kvesti artıq həll etmişdin." : attempts === 1 ? "Möhtəşəm, ilk cəhddə! " + MODULES.find(m => m.id === q.module).name + " modulunda irəliləyişin artdı." : "Əla! Səhvini özün tapıb düzəltdin. Ən yaxşı öyrənmə belə olur." });
    } else {
      setTerm(t => [...t, { t: "✘ " + r.passed + "/" + q.tests.length + " test keçdi", c: "text-[#FF8A85] font-bold" }]);
      const d = diagnose(q, r, code);
      update(s => {
        const ms = { ...s.misconceptions };
        if (d && d.tag !== "logic") { const key = q.module + ":" + d.tag; const labels = { offbyone: "off-by-one (range sərhədləri)", syntax: "sintaksis", indent: "girinti", name: "dəyişən adları", loop: "sonsuz dövr", base: "rekursiya baza halı", type: "tip çevirmə", return: "return əvəzinə print" }; ms[key] = { module: q.module, label: labels[d.tag] || d.tag, count: (ms[key]?.count || 0) + 1 }; }
        return { ...s, attempts: { ...s.attempts, [qid]: attempts }, misconceptions: ms, activity: [{ who: s.user.name, text: q.title + ": " + r.passed + "/" + q.tests.length + " test" + (d ? " · " + d.tag : ""), ok: false, time: nowStr() }, ...s.activity].slice(0, 30) };
      });
      if (aiOn && d) say({ kind: "diag", text: d.text });
    }
  };

  const hint = async () => {
    if (!aiOn) return;
    const i = Math.min(hints, q.hints.length - 1);
    update(s => ({ ...s, hintsUsed: { ...s.hintsUsed, [qid]: hints + 1 } }));
    await say({ kind: "hint", text: "İpucu " + (i + 1) + "/" + q.hints.length + ": " + q.hints[i] + (hints >= q.hints.length - 1 ? " Bu son ipucudur." : "") });
  };
  const send = async e => {
    e.preventDefault(); const t = msg.trim(); if (!t || !aiOn) return; setMsg("");
    setChat(c => [...c, { from: "me", text: t }]);

function TMaterial({ st, update, toast }) {
  const [text, setText] = useState(SAMPLE_SYLLABUS);
  const [busy, setBusy] = useState(false);
  const parse = async () => {
    setBusy(true); await sleep(900);
    const weeks = []; const re = /(?:Həftə|Week)\s*(\d+)\s*[:.\-]\s*(.+)/gi; let m;
    while ((m = re.exec(text))) { const [topic, rest] = m[2].split(/\s+[—–-]\s+/); weeks.push({ week: +m[1], topic: topic.trim(), concepts: (rest || "").split(/,\s*/).filter(Boolean) }); }
    const name = (text.match(/Kurs\s*:\s*(.+)/i) || [])[1] || "Kurs";
    update(s => ({ ...s, plan: { name, weeks } })); setBusy(false);
    toast({ title: weeks.length + " həftəlik plan hazırdır", sub: name, icon: "CalendarCheck" });
  };
  const onFile = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => setText(String(r.result).slice(0, 40000)); r.readAsText(f); };
  return html`<div className="gutter-x py-6 max-w-6xl mx-auto grid lg:grid-cols-2 gap-5">
    <${Card} className="flex flex-col gap-4">
      <div className="flex items-center gap-3"><span className="w-11 h-11 rounded-2xl bg-brand-50 text-brand-500 grid place-items-center"><${Icon} name="FileUp" size=${22} /></span><div><h3 className="font-display text-xl font-bold">Kurs materialı</h3><p className="text-sm text-ink-500">Sillabusu yapışdır və ya .txt fayl yüklə</p></div></div>
      <label htmlFor="matFile" className="flex items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-ink-200 hover:border-brand-500 p-5 cursor-pointer font-extrabold text-ink-500"><${Icon} name="Upload" size=${20} />Fayl seç (.txt, .md)<input id="matFile" type="file" accept=".txt,.md" className="sr-only" onChange=${onFile} /></label>
      <label htmlFor="matText" className="sr-only">Material mətni</label>
      <textarea id="matText" value=${text} onInput=${e => setText(e.target.value)} className="min-h-[260px] rounded-2xl ring-1 ring-ink-200 focus:ring-2 focus:ring-brand-500 outline-none p-4 font-mono text-sm bg-ink-50"></textarea>
      <${Btn} onClick=${parse} disabled=${busy}>${busy ? html`<${Icon} name="LoaderCircle" size=${18} className="animate-spin" />Material oxunur…` : html`<${Icon} name="Sparkles" size=${18} />Dərs planını çıxar`}<//>

        : html`<div className="flex-1 grid place-items-center text-center py-10"><div><${Capy} className="w-28 mx-auto opacity-80" /><p className="text-ink-500 mt-3 max-w-xs">Materialı yükləyib "Dərs planını çıxar" düyməsini bas. Həftələr və mövzular burada görünəcək.</p></div></div>`}

  return html`<div className="gutter-x py-6 max-w-6xl mx-auto grid gap-6">
    <div><h2 className="font-display text-2xl font-extrabold">Təsdiq gözləyənlər <span className="text-ink-400">${pending.length}</span></h2><p className="text-ink-500 text-sm">AI materialdan bu tapşırıqları hazırlayıb. Yoxla, rejimi seç və şagirdlərə göndər.</p></div>
    ${pending.length ? html`<div className="grid md:grid-cols-2 gap-4">${pending.map(d => { const c = checks[d.id]; const ok = c && c.passed === d.tests.length; return html`<${Card} key=${d.id} className="flex flex-col gap-3">
      <div className="flex items-center gap-2"><span className="text-xs font-extrabold px-2.5 py-1 rounded-full bg-capy-100 text-capy-800 flex items-center gap-1"><${Icon} name="Sparkles" size=${13} />AI yaratdı</span><${DiffTag} d=${d.diff} /><span className="ml-auto text-sm font-extrabold text-ink-500">${MODULES.find(m => m.id === d.module).name}</span></div>
      <h3 className="font-display text-xl font-bold">${d.title}</h3><p className="text-sm text-ink-700">${d.task}</p>
      <pre className="bg-code-900 text-[#D7DEF2] rounded-2xl p-3 font-mono text-xs overflow-x-auto" dangerouslySetInnerHTML=${{ __html: highlight(d.solution) }}></pre>
      <div className="grid gap-1">${d.tests.map((t, i) => { const r = c?.results[i]; return html`<div key=${i} className="flex items-center gap-2 text-xs font-mono"><span className=${cls("w-5 h-5 rounded-full grid place-items-center", !r ? "bg-ink-100" : r.status === "OK" ? "bg-mint-500 text-white" : "bg-rose-500 text-white")}>${r ? html`<${Icon} name=${r.status === "OK" ? "Check" : "X"} size=${11} strokeWidth=${3} />` : null}</span>${d.fn}(${t.args.slice(1, -1)}) → ${t.expected}</div>`; })}</div>
      ${c ? html`<div className=${cls("rounded-xl px-3 py-2 text-sm font-extrabold", ok ? "bg-mint-100 text-mint-600" : "bg-rose-100 text-rose-500")}>${ok ? "Nümunə həll " + c.passed + "/" + d.tests.length + " testdən keçdi (real Python)" : "Xəta: testlər keçmədi"}</div>` : null}
      <div className="flex flex-wrap items-center gap-2 mt-auto">
        ${!c ? html`<${Btn} kind="soft" size="sm" disabled=${busy === d.id} onClick=${() => validate(d)}>${busy === d.id ? html`<${Icon} name="LoaderCircle" size=${15} className="animate-spin" />Yoxlanır…` : html`<${Icon} name="FlaskConical" size=${15} />Testlərlə yoxla`}<//>` : null}
        <${ModeSel} id=${d.id} value=${modes[d.id] || "hint"} onChange=${v => setModes(m => ({ ...m, [d.id]: v }))} />
        <${Btn} size="sm" disabled=${!ok} onClick=${() => approve(d)} className="ml-auto"><${Icon} name="Send" size=${15} />Təsdiqlə və göndər<//>
      </div><//>`; })}</div>` : html`<${Card} className="text-center text-ink-500">Bütün tapşırıqlar göndərilib.<//>`}
    <div><h2 className="font-display text-2xl font-extrabold">Aktiv tapşırıqlar <span className="text-ink-400">${live.length}</span></h2></div>
    <${Card} className="p-0 overflow-x-auto"><table className="w-full min-w-[620px] text-sm"><thead className="bg-ink-50"><tr>${["Tapşırıq", "Modul", "Çətinlik", "Həll edən", "AI rejimi"].map(h => html`<th key=${h} className="text-left px-4 py-3 font-extrabold text-ink-500">${h}</th>`)}</tr></thead>
      <tbody>${live.map(q => html`<tr key=${q.id} className="border-t border-ink-200"><td className="px-4 py-2.5 font-extrabold">${q.title}${st.published.includes(q.id) ? html` <span className="text-xs text-capy-600">· yeni</span>` : null}</td><td className="px-4">${MODULES.find(m => m.id === q.module).name}</td><td className="px-4"><${DiffTag} d=${q.diff} /></td><td className="px-4 font-mono">${st.completed[q.id] ? "1 (canlı)" : "0"}</td><td className="px-4 py-2"><${ModeSel} id=${q.id} value=${st.modes[q.id] || "hint"} onChange=${v => setMode(q.id, v)} /></td></tr>`)}</tbody></table><//>
  </div>`;
}

function TClass({ st }) {
  const rows = classRows(st);
  const [sel, setSel] = useState(0);
  const r = rows[sel];
  const avg = row => Math.round(MODULES.slice(0, 6).reduce((a, m) => a + (row.m[m.id] || 0), 0) / 6);
  return html`<div className="gutter-x py-6 max-w-6xl mx-auto grid lg:grid-cols-[1fr_360px] gap-5">
    <${Card} className="p-0 overflow-hidden"><div className="divide-y divide-ink-200">${rows.map((row, i) => html`<button key=${row.name} onClick=${() => setSel(i)} className=${cls("w-full flex items-center gap-4 px-5 py-4 text-left", sel === i ? "bg-brand-50" : "hover:bg-ink-50")}><span className=${cls("w-11 h-11 rounded-2xl grid place-items-center font-extrabold text-white", row.live ? "bg-brand-500" : "bg-ink-400")}>${row.name.split(" ").map(s => s[0]).join("").slice(0, 2)}</span><div className="flex-1 min-w-0"><b className="block truncate">${row.name}</b><div className="h-2 mt-1.5 rounded-full bg-ink-100 overflow-hidden"><div className="h-full rounded-full" style=${{ width: avg(row) + "%", background: mColor(avg(row)) }}></div></div></div><span className="font-mono font-bold w-10 text-right">${avg(row)}</span></button>`)}</div><//>
    <${Card} key=${sel} className="self-start rise">
      <h3 className="font-display text-2xl font-extrabold">${r.name}</h3><p className="text-sm text-ink-500 mb-4">${r.live ? "Bu şagirdin məlumatları canlı yenilənir" : "Nümunə şagird"}</p>
      <div className="grid gap-2.5">${MODULES.map(m => { const v = r.m[m.id] || 0; return html`<div key=${m.id} className="flex items-center gap-3"><span className="w-24 text-sm font-extrabold">${m.name}</span><div className="flex-1 h-2.5 rounded-full bg-ink-100 overflow-hidden"><div className="h-full rounded-full" style=${{ width: v + "%", background: mColor(v) }}></div></div><span className="w-8 text-right font-mono text-xs">${v || "—"}</span></div>`; })}</div>
      ${r.live && Object.keys(st.misconceptions).length ? html`<div className="mt-4 rounded-2xl bg-rose-100 p-4 text-sm"><b className="text-rose-500">AI aşkarladı:</b> ${Object.values(st.misconceptions).map(x => x.label + " (" + x.count + ")").join(", ")}</div>` : null}
    <//>
  </div>`;
}

// ================= APP =================
function App() {
  const [st, setSt] = useState(load);
  const [route, setRoute] = useState(() => { try { return localStorage.getItem(KEY + ":route") || "home"; } catch (e) { return "home"; } });
  const [qid, setQid] = useState(null);
  const [lessonId, setLessonId] = useState(null);
  const [toasts, setToasts] = useState([]);
  const update = useCallback(fn => setSt(s => { const n = normalizeDay(fn(s)); save(n); return n; }), []);
  const toast = useCallback(t => { const id = Date.now() + Math.random(); setToasts(x => [...x, { ...t, id }]); setTimeout(() => setToasts(x => x.filter(y => y.id !== id)), 3600); }, []);
  const go = r => { setRoute(r); setQid(null); setLessonId(null); try { localStorage.setItem(KEY + ":route", r); } catch (e) {} };

  const celebrate = useCallback((q, { attempts, hints }) => {
    update(s => {
      if (s.completed[q.id]) return s;
      const prevLevel = levelOf(s.xp);
      const xp = s.xp + q.xp;
      const gain = Math.max(5, DIFF[q.diff].gain - hints * 4);
      const mastery = { ...s.mastery, [q.module]: Math.min(100, (s.mastery[q.module] || 0) + gain) };
      const completed = { ...s.completed, [q.id]: { attempts, hints } };
      const dated = awardXP(s, q.xp);
      const ach = new Set(s.achievements); const before = new Set(s.achievements);
      const n = Object.keys(completed).length;
      if (n >= 1) ach.add("first"); if (n >= 3) ach.add("three"); if (n >= 5) ach.add("five");
      if (attempts === 1) ach.add("perfect"); if (hints === 0) ach.add("nohint"); if (attempts > 1) ach.add("comeback");
      if (q.module === "loops" && mastery.loops >= 80) ach.add("loops"); if (levelOf(xp) >= 3) ach.add("lvl3");
      const misconceptions = { ...s.misconceptions };
      if (attempts > 1) Object.keys(misconceptions).forEach(k => { if (k.startsWith(q.module + ":")) { misconceptions[k] = { ...misconceptions[k], count: misconceptions[k].count - 1 }; if (misconceptions[k].count <= 0) delete misconceptions[k]; } });
      const newAch = [...ach].filter(a => !before.has(a));
      setTimeout(() => {
        toast({ title: "Kvest tamamlandı!", sub: "+" + q.xp + " XP · " + q.title, icon: "Trophy" });
        if (levelOf(xp) > prevLevel) setTimeout(() => toast({ kind: "level", title: "Səviyyə " + levelOf(xp) + "!", sub: "Yeni səviyyəyə çatdın", icon: "Crown" }), 500);
        newAch.forEach((a, i) => setTimeout(() => { const A = ACH.find(x => x.id === a); toast({ kind: "ach", title: "Yeni nişan: " + A.title, sub: A.desc, icon: A.icon }); }, 900 + i * 500));
        if (!s.streakToday) setTimeout(() => toast({ kind: "ach", title: "Ardıcıllıq " + dated.streak + " gün!", sub: "Bu günü qorudun", icon: "Flame" }), 300);
      }, 50);
      return { ...dated, mastery, completed, achievements: [...ach], misconceptions,
        activity: [{ who: s.user.name, text: q.title + " həll olundu · +" + q.xp + " XP", ok: true, time: nowStr() }, ...s.activity].slice(0, 30) };
    });
  }, [update, toast]);

  useEffect(() => {
    const refresh = () => setSt(s=>normalizeDay(withCourse(s)));
    const timer = setInterval(refresh,60000);
    window.addEventListener("focus",refresh); window.addEventListener("storage",refresh);
    return () => {clearInterval(timer); window.removeEventListener("focus",refresh); window.removeEventListener("storage",refresh);};
  },[update]);
  const finishLesson = (id, mistakes) => update(s => {
    if(s.lessons[id])return s;
    const n=awardXP(s,50);
    return {...n,lessons:{...s.lessons,[id]:{mistakes,date:dayKey()}},mastery:{...s.mastery,[id]:Math.min(100,(s.mastery[id]||0)+10)}};
  });
  if (!st.user) return html`<${Login} onLogin=${(name, role, track) => { update(() => loginState(name,role,track)); go(role === "teacher" ? "t-home" : "home"); }} /><${Toasts} items=${toasts} />`;
  if (st.user.role === "student" && !st.onboarded) return html`<${Onboarding} name=${st.user.name} onDone=${score => { update(s => ({ ...s, onboarded: true, mastery: { ...score }, achievements: [...new Set([...s.achievements, "quiz"])] })); go("path"); toast({ kind: "ach", title: "Yeni nişan: Diaqnoz", sub: "Giriş testini tamamladın", icon: "Stethoscope" }); }} /><${Toasts} items=${toasts} />`;

  const openQuest = id => { setLessonId(null); setQid(id); };
  const openLesson = id => {setQid(null);setLessonId(id);};
  const switchRole = () => { const role = st.user.role === "teacher" ? "student" : "teacher"; update(s => withCourse({ ...s, track: "class", user: { ...s.user, role } })); go(role === "teacher" ? "t-home" : "home"); };
  const logout = () => { save(st); update(() => fresh()); setQid(null); setLessonId(null); };
  const titles = { home: "Öyrənmə yolum", path: "Mövzuları kəşf et", quests: "Kvestlər", ach: "Nailiyyətlər", profile: "Profil", "t-home": "Müəllim paneli", "t-material": "Kurs materialı", "t-labs": "Tapşırıqlar", "t-class": "Sinif" };
  let body, title = titles[route] || "Codigo", full = false;
  const r = st.user.role === "teacher" ? (route.startsWith("t-") || route === "profile" ? route : "t-home") : (route.startsWith("t-") ? "home" : route);
  if (lessonId && st.user.role === "student") { body = html`<${Lesson} key=${lessonId} moduleId=${lessonId} st=${st} finish=${finishLesson} back=${()=>setLessonId(null)} openQuest=${openQuest}/>`; title="İnteraktiv dərs"; }
  else if (qid && st.user.role === "student") { body = html`<${Workspace} key=${qid} st=${st} qid=${qid} update=${update} back=${() => setQid(null)} toast=${toast} celebrate=${celebrate} />`; title = "Kvest"; full = true; }
  else if (r === "home") body = html`<${Journey} st=${st} openQuest=${openQuest} openLesson=${openLesson} update=${update} />`;
  else if (r === "path") body = html`<${Journey} st=${st} openQuest=${openQuest} openLesson=${openLesson} update=${update} />`;
  else if (r === "quests") body = html`<${QuestList} st=${st} openQuest=${openQuest} />`;
  else if (r === "ach") body = html`<${Achievements} st=${st} />`;
  else if (r === "profile") body = html`<${Profile} st=${st} update=${update} logout=${logout} switchRole=${switchRole} />`;
  else if (r === "t-home") body = html`<${THome} st=${st} go=${go} />`;
  else if (r === "t-material") body = html`<${TMaterial} st=${st} update=${update} toast=${toast} />`;
  else if (r === "t-labs") body = html`<${TLabs} st=${st} update=${update} toast=${toast} />`;
  else if (r === "t-class") body = html`<${TClass} st=${st} />`;
  return html`<${Shell} st=${st} route=${qid ? "quests" : r} go=${go} title=${titles[r] && !qid && !lessonId ? titles[r] : title} full=${full}>${body}<//><${Toasts} items=${toasts} />`;
}

const { Login, Journey, Lesson } = window.CodigoJourney({React,html,Icon,Capy,Wordmark,MODULES,allQuests,unlocked,dayKey});
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
